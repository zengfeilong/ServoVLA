[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servovla"
version = "0.1.0"
description = "ServoVLA: chunk-first vision-language-action training and deployment stack"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    # Core deep-learning
    "torch>=2.7",
    "torchvision>=0.22",

    # Config management
    "hydra-core>=1.3",
    "omegaconf>=2.3",

    # Vision & VLM
    "transformers==5.3.0",
    "timm>=1.0",

    # Data / LeRobot
    "lerobot==0.5.1",

    # Utilities
    "numpy>=2.0,<2.3",
    "pandas>=2.2",
    "tqdm>=4.66",
    "pillow>=10.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
]

[project.scripts]
lerobot-servovla-policy-server = "lerobot_policy_servovla.async_policy_server:serve"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["servovla*", "lerobot_policy_servovla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    # Ruff's formatter intentionally leaves some long strings unsplit.
    "E501",
    # Entry points and optional simulator modules import after path/dependency setup.
    "E402",
]
