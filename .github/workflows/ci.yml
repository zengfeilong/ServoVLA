name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: CPU tests
        run: >-
          pytest -q
          tests/test_action_mode.py
          tests/test_action_normalization.py
          tests/test_action_normalization_stats.py
          tests/test_architectures.py
          tests/test_batch_mixing.py
          tests/test_default_configs.py
          tests/test_frame_delay_runtime.py
          tests/test_jetson_workspace_runner.py
          tests/test_plugin_packaging.py
