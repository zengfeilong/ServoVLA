# @package model.vision_encoder
# Per-step spatial feature encoder.
# Used by end-to-end training and deployment inference.

model_id: facebook/dinov3-vitb16-pretrain-lvd1689m   # default
attn_implementation: sdpa

# Available choices (swap on CLI):
#   facebook/dinov3-vitl16-pretrain-lvd1689m   feature_dim=1024
#   facebook/dinov3-vitb16-pretrain-lvd1689m   feature_dim=768
#   facebook/dinov3-vits16-pretrain-lvd1689m   feature_dim=384

# Output feature dimension for the chosen model.
# Must stay consistent with the policy head feature contract.
feature_dim: 768          # ViT-B/16

# Image pre-processing
image_size: 256
